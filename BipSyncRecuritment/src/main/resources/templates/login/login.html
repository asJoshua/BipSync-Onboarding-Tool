<!DOCTYPE html>
<html>
    <head>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta1/dist/css/bootstrap.min.css" rel="stylesheet">

        <link rel="stylesheet" href="/css/home.css" />
        <link rel="stylesheet" href="/css/login.css" />

        <meta charset="ISO-8859-1">
        <title>Login</title>
    </head>
    <body>

    <div class = "login-container">
        <div class="login-form-container">

            <div th:if="${param.error}">
                <div class="error-message">
                    <p>Username or password is Incorrect</p>
                </div>
            </div>

            <div th:if="${param.logout}">
                <div class="logout-message">
                    <p>Successfully logged out</p>
                </div>
            </div>

            <h2 class="login-title">BipSync</h2>

            <form method="post"  role="login-form"  th:action="@{/login}"  th:object="${user}">

                <div class="mb-3 p-2">
                    <label for="username" class="form-label">Username</label>
                    <input th:field="*{username}"  class="form-control" aria-describedby="emailHelp" type="text" id="username" name="username" placeholder="Enter your username" required>
                </div>
                <div class="mb-3 p-2">
                    <label for="password" class="form-label">Password</label>
                    <input th:field="*{password}"  class="form-control" type="password" id="password" name="password" placeholder="Enter your password" required>
                </div>

                <div style="text-align: center;" class="mt-3">
                    <button type="" class="btn btn-danger">Login</button>
                </div>
            </form>

        </div>
    </div>

    </body>
</html>
