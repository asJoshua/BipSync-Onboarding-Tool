<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
    <link rel="stylesheet" href="/css/main.css" />
    <link rel="stylesheet" href="/css/login.css" />
    <title>Forgot Password</title>
</head>


<body>
<div class="login-container">

    <div class="login-form-container">

    <h2 class="login-title">Forgot Password</h2>

    <div th:if="${param.success}" class="success-container">
        <div class="alert alert-success">Email Sent! Click on link sent to Reset Password.</div>
    </div>

    <div th:if="${param.error}" class="error-container">
        <div class="alert alert-danger">Token has Expired. Please enter your email again.</div>
    </div>

    <form th:action="@{/forgotPassword}" method="post">

        <div class="form-group">
            <label class="form-label" for="email">Email</label>
            <input type="email" class="form-control" id="email" name="email" placeholder="Enter your email" required>
        </div>

        <div style="text-align: center;" class="mt-3">
            <button type="submit" class="btn btn-danger">Submit</button>
        </div>
    </form>
        </div>
</div>


</body>

</html>
