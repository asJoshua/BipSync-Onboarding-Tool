<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
    <title>Forgot Password</title>
</head>


<body>
<div class="container">

    <div th:if="${param.success}" class=success-container>
        <div class="alert alert-info text-white">Email Sent! Click on link sent to Reset Password.</div>
    </div>
    <div th:if="${param.error}" class="error-container">
        <div class="alert alert-info text-white">Token  has Expired. Please click link for Forgot Password again.</div>
    </div>
    <h2>Forgot Password</h2>
    <form th:action="@{/forgotPassword}" method="post">
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>
        </div>
        <button type="submit" class="btn-submit">Submit</button>
    </form>
</div>
</body>

</html>
