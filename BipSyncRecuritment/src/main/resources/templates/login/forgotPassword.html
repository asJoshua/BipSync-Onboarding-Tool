<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
    <link rel="stylesheet" href="/css/style.css" />
    <title>Forgot Password</title>
</head>


<body>
<div class="forgot-pass-container">

    <div class="forgot-pass-form-container">

    <div th:if="${param.success}" class=success-container>
        <div class="alert alert-success">Email Sent! Click on link sent to Reset Password.</div>
    </div>
    <div th:if="${param.error}" class="error-container">
        <div class="alert alert-danger">Token has Expired. Please enter your email again.</div>
    </div>
    <h2 class="forgot-pass-title">Forgot Your Password</h2>
    <form th:action="@{/forgotPassword}" method="post">
        <div class="form-group">
            <label class="email" for="email">Email</label>
            <input type="email" id="email" name="email" required>
        </div>
        <div class="btn-for-forgot-pass">
        <button type="submit" class="btn-forgot-pass">Submit</button>
        </div>
    </form>
        </div>
</div>


</body>

</html>
