<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css" integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">


  <link rel="stylesheet" href="/css/main.css" />
  <link rel="stylesheet" href="/css/login.css">
    <title>Register Staff</title>
</head>
<body>


  <div class=" login-container">
    <div class="login-form-container">

    <form th:action="@{/registerStaff}" th:object="${user}" method="post">
      <h2 class="form-title">Register a New User</h2>

      <div class="d-flex justify-content-center">
        <div class="mb-3 p-2">
          <label for="username" class="form-label">Username:</label>
          <input id="username" type="text" class="form-control" th:field="*{username}">
          <div class="alert alert-danger" th:if="${#fields.hasErrors('username')}" th:errors="*{username}">Username Error</div>
        </div>

        <div class="mb-3 p-2">
          <label for="password">Password:</label>
          <input  id="password" type="password" class="form-control" th:field="*{password}">
          <div class="alert alert-danger" th:errors="*{password}" th:if="${#fields.hasErrors('password')}">Password Error</div>
        </div>
      </div>

      <div class="d-flex justify-content-center">
        <div class="mb-3 p-2">
          <label for="userFirstName">First Name:</label>
          <input id="userFirstName" type="text" class="form-control" th:field="*{userFirstName}">
          <div class="alert alert-danger" th:errors="*{userFirstName}" th:if="${#fields.hasErrors('userFirstName')}">First Name Error</div>
        </div>

        <div class="mb-3 p-2">
          <label for="userLastName">Last Name:</label>
          <input id="userLastName" type="text" class="form-control" th:field="*{userLastName}">
          <div class="alert alert-danger" th:errors="*{userLastName}" th:if="${#fields.hasErrors('userLastName')}">Last Name Error</div>
        </div>
      </div>

      <div class="d-flex justify-content-center">
          <div class="mb-3 p-2">
            <label for="email">User Email:</label>
            <input  id="email" type="email" style="width: 428px;"  placeholder="name@example.com" class="form-control" th:field="*{userEmail}">
            <div class="alert alert-danger" th:errors="*{userEmail}" th:if="${#fields.hasErrors('userEmail')}">Email Error</div>
          </div>
      </div>

      <div class="d-flex justify-content-center">
        <div th:if="${success}" class="error-container">
          <div class="alert alert-success" th:text="${success}"></div>
        </div>
      </div>

      <div class="d-flex justify-content-center">
          <div class="btn-for-register">
            <button type="submit" class="btn btn-danger">Register Staff User</button>
          </div>
      </div>

      <div class="d-flex justify-content-center">
        <div class="btn-for-register">
          <a th:href="@{/home}"class="btn btn-primary">Back</a></td>
        </div>
      </div>


    </form>
  </div>
  </div>

</body>
</html>
