<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Register Staff</title>
</head>
<body>
<div class="container">
  <h2>User Registration</h2>
  <form th:action="@{/registerStaff}" th:object="${user}" method="post">
    <div class="form-group">
      <label for="username">Username:</label>
      <input  id= "username" type="text" class="form-control" th:field="*{username}" required>
    </div>
    <div class="form-group">
      <label for="email">Password:</label>
      <input  id="email" type="email" class="form-control" th:field="*{userEmail}" required>
    </div>
    <div class="form-group">
      <label for="userFirstName">Full Name:</label>
      <input id="userFirstName" type="text" class="form-control" th:field="*{userFirstName}" required>

    </div>

    <div class="form-group">
      <label for="userLastName">Full Name:</label>
      <input id="userLastName" type="text" class="form-control" th:field="*{userLastName}" required>

    </div>

    <div class="form-group">
      <label for="password">Full Name:</label>
      <input  id="password" type="password" class="form-control" th:field="*{password}" required>

    </div>
    <button type="submit" class="btn btn-primary">Register Staff User</button>
  </form>
</div>

</body>
</html>
