<!doctype html>
<html lang="en">
<head>

    <title>New Recruit Form</title>
</head>

<body>
<h2 class="form-title">New Recruit Form</h2>

<section>
    <form th:action="@{newRecruit}" th:method="post" th:object="${newRecruit}" >
        <div class="container form-ctn">
            <div class="d-flex p-4">
                <label for="firstName">First Name:</label>
                <input type="text" id="firstName" name="firstName" th:field="*{firstName}" required>
                <br>

                <label for="lastName">Last Name:</label>
                <input type="lastName" id="lastName" name="lastName" th:field="*{lastName}" required>
                <br>
            </div>

            <div class="d-flex p-4">
                <label for="dateOfBirth">Date of Birth:</label>
                <input type="date" id="dateOfBirth" name="dateOfBirth" th:field="*{dateOfBirth}" required>
                <br>

                <label for="phoneNumber">Phone Number:</label>
                <input type="phoneNumber" id="phoneNumber" name="phoneNumber" th:field="*{phoneNumber}" required>
                <br>
            </div>

            <div class="d-flex p-4">
                <label for="passportNumber">Passport Number:</label>
                <input type="text" id="passportNumber" name="passportNumber" th:field="*{passportNumber}" required>
                <br>

                <label for="nationalInsurance">National Insurance:</label>
                <input type="nationalInsurance" id="nationalInsurance" name="nationalInsurance" th:field="*{nationalInsurance}" required>
                <br>
            </div>

            <div class="d-flex p-4">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" th:field="*{email}" required>
                <br>
            </div>

            <dic class="d-flex p-4">
                <label for="emergencyContactName">Emergency Contact Name:</label>
                <input type="text" id="emergencyContactName" name="emergencyContactName" th:field="*{emergencyContactName}" required>
                <br>

                <label for="emergencyContactPhone">Emergency Contact Phone Number:</label>
                <input type="emergencyContactPhone" id="emergencyContactPhone" name="emergencyContactPhone" th:field="*{emergencyContactPhone}" required>
                <br>
            </dic>

            <button type="submit" class="login-btn">Submit</button>
        </div>
    </form>
</section>

</body>
</html>
