<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>New Recruit Details</title>
</head>
<body>

<table>
  <thead>
  <tr>
    <th>New Recruit</th>
  </thead>
  <tbody>
  <tr>
    <td>Id</td>
    <td th:text="${newRecruit.id}"></td>
  </tr>
  <tr>
    <td>First Name</td>
    <td th:text="${newRecruit.firstName}"></td>
  </tr>
  <tr>
    <td>Last Name</td>
    <td th:text="${newRecruit.lastName)}"></td>
  </tr>
  </tbody>
</table>
</body>
</html>
