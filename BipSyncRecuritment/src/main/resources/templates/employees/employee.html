
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
    <title>Current EmployeesList</title>
</head>
<body>

<h1>Current Employees List</h1>


<table  class="list-group">
    <tr>
        <th>Name</th>
    </tr>
    <tr  class="list-group-item"th:each="employee : ${employees}">
        <td class="list-group-item" th:text="${employee.firstName}"></td>
        <td class="list-group-item" th:text="${employee.lastName}"></td>
        <td><a>View Tasks</a></td>
    </tr>
</table>


</body>
</html>
