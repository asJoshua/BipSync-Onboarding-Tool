<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
    <link rel="stylesheet" href="/css/main.css" />
    <title>Edit Details</title>
</head>
<body>
<div id="header">
    <div th:replace="~{fragments/header :: header}"/>
</div>

<div class="content" style="margin-left: 250px">

    <h2 class="form-title">Edit Details</h2>

    <form th:action="@{'/employee/' + ${employee.recruitId} + '/edit'}" method="post"  id="editForm" class="container form-ctn">
        <div class="mb-3 p-2">
            <label for="firstName" class="form-label">Edit Employee First Name:</label>
            <input type="text" id="firstName" name="firstName" class="form-control" th:value="${employee.firstName}" >
            <div class="alert alert-danger" th:errors="*{employee.firstName}" th:if="${#fields.hasErrors('employee.firstName')}">First Name Error</div>
        </div>
        <div class="mb-3 p-2">
            <label for="lastName" class="form-label">Edit Employee Last Name:</label>
            <input type="text" id="lastName" name="lastName" class="form-control" th:value="${employee.lastName}" >
            <div class="alert alert-danger" th:errors="*{employee.lastName}" th:if="${#fields.hasErrors('employee.lastName')}">Last Name Error</div>
        </div>
        <div class="mb-3 p-2" >
            <label for="dateOfBirth" class="form-label">Edit Employee Date Of Birth:</label>
            <input type="date" id="dateOfBirth" class="form-control" name="dateOfBirth" th:value="${employee.dateOfBirth}" required >
        </div>
        <div class="mb-3 p-2">
            <label for="position" class="form-label">Edit Employee Position:</label>
            <input type="text" id="position" class="form-control" name="position" th:value="${employee.position}" >
            <div class="alert alert-danger" th:errors="*{employee.position}" th:if="${#fields.hasErrors('employee.position')}">Position Error</div>
        </div>
        <div class="mb-3 p-2">
            <label for="email" class="form-label">Edit Employee Email:</label>
            <input type="text" id="email" class="form-control" name="email" th:value="${employee.email}" >
            <div class="alert alert-danger" th:errors="*{employee.email}" th:if="${#fields.hasErrors('employee.email')}">Email Error</div>
        </div>
        <div class="mb-3 p-2">
            <label for="phoneNumber" class="form-label">Edit Employee Phone Number:</label>
            <input type="text" id="phoneNumber" name="phoneNumber" class="form-control" th:value="${employee.phoneNumber}" >
            <div class="alert alert-danger" th:errors="*{employee.phoneNumber}" th:if="${#fields.hasErrors('employee.phoneNumber')}">Phone Number Error</div>
        </div>
        <div class="mb-3 p-2">
            <label for="passportNumber" class="form-label">Edit Employee Passport Number:</label>
            <input type="text" id="passportNumber" name="passportNumber" class="form-control" th:value="${employee.passportNumber}" >
            <div class="alert alert-danger" th:errors="*{employee.passportNumber}" th:if="${#fields.hasErrors('employee.passportNumber')}">Passport Number Error</div>
        </div>
        <div class="mb-3 p-2">
            <label for="nationalInsuranceNumber" class="form-label">Edit Employee NI Number:</label>
            <input type="text" id="nationalInsuranceNumber" class="form-control" name="nationalInsuranceNumber" th:value="${employee.nationalInsuranceNumber}" >
            <div class="alert alert-danger" th:errors="*{employee.nationalInsuranceNumber}" th:if="${#fields.hasErrors('employee.nationalInsuranceNumber')}">National Insurance Number Error</div>
        </div>
        <div class="mb-3 p-2">
            <label for="dateOfHire" class="form-label">Edit Employee Date of Hire:</label>
            <input type="date" id="dateOfHire" class="form-control" name="dateOfHire" th:value="${employee.dateOfHire}" required >
        </div>
        <div class="mb-3 p-2">
            <label for="emergencyContactName" class="form-label">Edit Employee Emergency Contact Name:</label>
            <input type="text" id="emergencyContactName" class="form-control" name="emergencyContactName" th:value="${employee.emergencyContactName}" >
            <div class="alert alert-danger" th:errors="*{employee.emergencyContactName}" th:if="${#fields.hasErrors('employee.emergencyContactName')}">Emergency Contact Name Error</div>
        </div>
        <div class="mb-3 p-2">
            <label for="emergencyContactPhoneNumber" class="form-label">Edit Employee Emergency Contact Number:</label>
            <input type="text" id="emergencyContactPhoneNumber" name="emergencyContactPhoneNumber" class="form-control" th:value="${employee.emergencyContactPhoneNumber}">
            <div class="alert alert-danger" th:errors="*{employee.emergencyContactPhoneNumber}" th:if="${#fields.hasErrors('employee.emergencyContactPhoneNumber')}">Emergency contact phone number Error</div>
        </div>

        <button type="submit" class="btn btn-success">Update Details</button>

    </form>
</div>
<div th:replace="~{fragments/header :: scripts}"></div>
</body>
</html>
