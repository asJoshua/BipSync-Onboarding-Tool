<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
    <link rel="stylesheet" href="/css/employee.css" />
    <meta charset="UTF-8">
    <title>Tasks</title>
</head>
<body>
<h1 class="task-employee-name" th:text="${employee.firstName}+'s' + ' ' + 'Tasks'"></h1>

<table class="table table-striped">
    <thead>
        <th scope="col">Task Name</th>
        <th scope="col">Task Due Date</th>
        <th scope="col">Responsibility</th>

        <th scope="col"> <button id="addNewTaskButton" data-toggle="modal" data-target="#myModal">Add a Task</button></th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="task, rowStat : ${employee.tasksOrderByDueDate}">
        <td th:id="'subject-' + ${task.taskId}" th:class="${#sets.contains(employee.completedTasks, task.taskId) ? 'complete' : ''}" th:text="${task.taskName}"></td>
        <td th:text="${task.taskDueDate}"></td>
        <td th:text="${task.taskResponsibility}"></td>
        <td>
            <form th:action="@{'/employee/' + ${employee.recruitId} + '/email/' + ${task.taskId}}" method="post">
                <button type="submit">Send Email Reminder</button>
            </form></td>
        <td>
            <form th:action="@{'/employee/' + ${employee.recruitId} + '/remove-task/' + ${task.taskId}}" method="post">

                <button type="submit" class="btn-complete">Mark as Complete</button>
            </form>
        </td>

    </tr>

    </tbody>
</table>




<!-- Bootstrap Modal -->
<div class="modal" id="myModal">
    <div class="modal-dialog">
        <div class="modal-content">

            <!-- Modal Header -->
            <div class="modal-header">
                <h4 class="modal-title">Add a Task</h4>
                <button type="button" class="close" data-dismiss="modal">&times;</button>
            </div>

            <!-- Modal Body -->
            <div class="modal-body">
                <form th:action="@{'/employee/' + ${employee.recruitId} + '/add-task'}" method="post">
                    <label class="taskLabel" for="taskName">Task Name:</label>
                    <input type="text" id="taskName" name="taskName" required>
                    <label class="taskLabel" for="taskDueDate">Task Due Date:</label>
                    <input type="date" id="taskDueDate" name="taskDueDate" pattern="\d{4}-\d{2}-\d{2}" required>
                    <label class="taskLabel" for="taskResponsibility">Task Responsibility:</label>
                    <select name="taskResponsibility" id="taskResponsibility">
                        <option value="IT">IT</option>
                        <option value="HR">HR</option>
                        <option value="Hiring Manager">Hiring Manager</option>
                        <option value="Facilities">Facilities</option>
                        <option value="Line Manager">Line Manager</option>
                    </select>
<div class="btn-submit" >
                    <button  type="submit" class="btn btn-primary">Add Task</button>
</div>
                </form>
            </div>

        </div>
    </div>
</div>


<a th:href="@{/employee}"class="btn btn-secondary">View Employees</a></td>




<!-- jQuery link -->
<script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>

<!-- Popper.js link -->
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.14.7/dist/umd/popper.min.js" integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1" crossorigin="anonymous"></script>

<!-- Bootstrap JS  link-->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/js/bootstrap.min.js" integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM" crossorigin="anonymous"></script>

</body>
</html>
