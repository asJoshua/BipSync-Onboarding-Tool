<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css" integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
  <link rel="stylesheet" href="/css/main.css" />
  <meta charset="ISO-8859-1">
  <title>Staff Members</title>
</head>
<body>
  <div id="header">
    <div th:replace="~{fragments/header :: header}"/>
  </div>

  <div class="content" style="margin-left: 250px">
    <h2>Staff Team</h2>
    <br>
    <table class="table table-bordered table-striped">
      <thead>
      <tr>
        <th>Name</th>
        <th>Surname</th>
        <th>Email</th>
        <th>Role</th>
        <th>Edit Staff</th>
        <th>Remove Staff</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="staff : ${StaffList}">
        <td th:text="${staff.name}"></td>
        <td th:text="${staff.lastName}"></td>
        <td th:text="${staff.email}"></td>
        <td th:text="${staff.role}"></td>
        <td><a th:href="@{/Staff/edit/{id}(id=${staff.id})}" class="btn btn-primary">Edit</a></td>
        <td><a th:href="@{/DeleteStaff/{id}(id=${staff.id})}" class="btn btn-danger">Delete</a></td>

      </tr>
      </tbody>
    </table>
  </div>

  <div th:replace="~{fragments/header :: scripts}"></div>
</body>
</html>
