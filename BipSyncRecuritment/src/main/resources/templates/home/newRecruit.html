<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>New Recruit Form</title>
    <link th:replace="~{fragments/header :: bootstrap-css}"/>
</head>
<body>

<div id="containers">

  <div th:replace="~{fragments/header :: header}"/>

</div>

<form action="/newRecruit" method="post">
  <div class="form-group">
    <label for="exampleFormControlInput1">First Name</label>
    <input type="email" class="form-control" id="exampleFormControlInput1" placeholder="John">
  </div>
  <div class="form-group">
    <label for="exampleFormControlInput2">Last Name</label>
    <input type="email" class="form-control" id="exampleFormControlInput2" placeholder="Doe">
  </div>
  <div class="form-group">
    <label for="exampleFormControlInput3">Email address</label>
    <input type="email" class="form-control" id="exampleFormControlInput3" placeholder="name@example.com">
  </div>
  <div class="form-group">
    <label for="exampleFormControlSelect1">Example select</label>
    <select class="form-control" id="exampleFormControlSelect1">
      <option>1</option>
      <option>2</option>
      <option>3</option>
      <option>4</option>
      <option>5</option>
    </select>
  </div>

  <div class="form-group">
    <label for="exampleFormControlTextarea1">Comments:</label>
    <textarea class="form-control" id="exampleFormControlTextarea1" rows="3"></textarea>
  </div>
</form>
</body>
</html>
