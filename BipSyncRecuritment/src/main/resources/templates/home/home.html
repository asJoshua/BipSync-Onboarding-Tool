<!doctype html>
<html xmlns:sec="http://www.w3.org/1999/xhtml">
<head>

    <meta charset="UTF-8">
    <title>Home</title>
    <link th:replace="~{fragments/header :: bootstrap-css}"/>

    <link rel="stylesheet" href="/css/main.css">

<body>
    <div id="header">
        <div th:replace="~{fragments/header :: header}"/>
    </div>

    <div class="content" style="margin-left: 250px;">
        <h1>Task Checklist</h1>
        <p>Tasks to be completed in chronological order.</p>
        <br>
        <h3>Overdue</h3>
        <table class="table table-striped">
            <thead>
                <th scope="col">Task Name</th>
                <th scope="col">Task Due Date</th>
                <th scope="col">Responsibility</th>
                </tr>
            </thead>
            <tbody>

            <tr th:each="task : ${overdueTasks}">
                <td th:text="${task.taskName}"></td>
                <td th:text="${task.taskDueDate}"></td>
                <td th:text="${task.taskResponsibility}"></td>
            </tr>

            </tbody>
        </table>

        <h3>Not overdue</h3>
        <table class="table table-striped">
            <thead>
            <th scope="col">Task Name</th>
            <th scope="col">Task Due Date</th>
            <th scope="col">Responsibility</th>
            </tr>
            </thead>
            <tbody>

            <tr th:each="task : ${notOverdueTasks}">
                <td th:text="${task.taskName}"></td>
                <td th:text="${task.taskDueDate}"></td>
                <td th:text="${task.taskResponsibility}"></td>
            </tr>

            </tbody>
        </table>

    </div>

    <div th:replace="~{fragments/header :: scripts}" ></div>
</body>
</html>
